<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — InvoicePro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="sidebar-logo">Invoice<span>Pro</span></div>
      <p class="auth-subtitle">Choose a new password.</p>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="At least 8 characters" />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter new password" />
      </div>
      <button class="btn btn-primary btn-block" onclick="resetPassword()">Reset Password</button>
      <p id="message" class="mt-16" style="text-align: center; font-size: 13px;"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    async function resetPassword() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      const response = await fetch("/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword, confirmPassword })
      });
      const data = await response.json();

      document.getElementById("message").textContent = data.message || data.error;
      document.getElementById("message").style.color = response.ok ? "#16a34a" : "#dc2626";

      if (response.ok) {
        setTimeout(() => window.location.href = "/index.html", 1500);
      }
    }
  </script>
</body>
</html>
