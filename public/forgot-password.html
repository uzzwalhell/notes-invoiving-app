<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — InvoicePro</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="sidebar-logo">Invoice<span>Pro</span></div>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>
      <button class="btn btn-primary btn-block" onclick="sendReset()">Send Reset Link</button>
      <p id="message" class="mt-16" style="text-align: center; font-size: 13px;"></p>
      <p style="text-align: center; margin-top: 16px;"><a href="/index.html">← Back to login</a></p>
    </div>
  </div>

  <script>
    async function sendReset() {
      const email = document.getElementById("email").value;
      const response = await fetch("/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      const data = await response.json();
      document.getElementById("message").textContent = data.message || data.error;
      document.getElementById("message").style.color = response.ok ? "#16a34a" : "#dc2626";
    }
  </script>
</body>
</html>
