<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>InvoicePro — Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="sidebar-logo">Invoice<span>Pro</span></div>
      <p class="auth-subtitle">UAE-compliant e-invoicing, made simple</p>

      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTab" onclick="switchTab('login')">Log In</div>
        <div class="auth-tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter your username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" />
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">Log In</button>
      </div>

      <div id="signupForm" style="display: none;">
        <div class="form-group">
          <label>Choose a Username</label>
          <input type="text" id="signupUsername" placeholder="Choose a username" />
        </div>
        <div class="form-group">
          <label>Choose a Password</label>
          <input type="password" id="signupPassword" placeholder="Choose a password" />
        </div>
        <button class="btn btn-primary btn-block" onclick="signup()">Create Account</button>
      </div>

      <p class="error-msg" id="authMessage"></p>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById("loginTab").classList.toggle("active", tab === "login");
      document.getElementById("signupTab").classList.toggle("active", tab === "signup");
      document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
      document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
      document.getElementById("authMessage").textContent = "";
    }

    async function login() {
      const username = document.getElementById("loginUsername").value;
      const password = document.getElementById("loginPassword").value;

      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();

      if (data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        window.location.href = "/dashboard.html";
      } else {
        document.getElementById("authMessage").textContent = data.error;
      }
    }

    async function signup() {
      const username = document.getElementById("signupUsername").value;
      const password = document.getElementById("signupPassword").value;

      const response = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();

      if (response.ok) {
        document.getElementById("authMessage").style.color = "#16a34a";
        document.getElementById("authMessage").textContent = "Account created! Switching to login...";
        setTimeout(() => switchTab("login"), 1200);
      } else {
        document.getElementById("authMessage").style.color = "#dc2626";
        document.getElementById("authMessage").textContent = data.error;
      }
    }

    // If already logged in, skip straight to dashboard
    if (localStorage.getItem("token")) {
      window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
