<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvoicePro — Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="sidebar-logo">Invoice<span>Pro</span></div>
      <p class="auth-subtitle">UAE-compliant e-invoicing, made simple</p>

      <div class="auth-tabs">
        <div class="auth-tab active" id="loginTab" onclick="switchTab('login')">Log In</div>
        <div class="auth-tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" />
        </div>
        <button class="btn btn-primary btn-block" onclick="login()">Log In</button>
        <p style="text-align: center; margin-top: 12px;">
          <a href="/forgot-password.html" style="font-size: 13px;">Forgot password?</a>
        </p>
      </div>

      <div id="signupForm" style="display: none;">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signupUsername" placeholder="Choose a username" oninput="validateSignupForm()" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" oninput="validateSignupForm()" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="At least 8 characters" oninput="validateSignupForm()" />
          <div id="passwordHint" class="text-muted" style="font-size: 12px; margin-top: 6px; line-height: 1.6;">
            Must include: <span id="checkLength">○ 8+ characters</span><br/>
            <span id="checkUpper">○ Uppercase letter</span> &nbsp;
            <span id="checkLower">○ Lowercase letter</span><br/>
            <span id="checkNumber">○ Number</span> &nbsp;
            <span id="checkSpecial">○ Special character</span>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirmPassword" placeholder="Re-enter your password" oninput="validateSignupForm()" />
          <div id="matchHint" style="font-size: 12px; margin-top: 4px;"></div>
        </div>
        <button class="btn btn-primary btn-block" id="signupBtn" onclick="signup()" disabled>Create Account</button>
      </div>

      <p class="error-msg" id="authMessage"></p>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById("loginTab").classList.toggle("active", tab === "login");
      document.getElementById("signupTab").classList.toggle("active", tab === "signup");
      document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
      document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
      document.getElementById("authMessage").textContent = "";
    }

    function validateSignupForm() {
      const password = document.getElementById("signupPassword").value;
      const confirm = document.getElementById("signupConfirmPassword").value;
      const email = document.getElementById("signupEmail").value;
      const username = document.getElementById("signupUsername").value;

      const checks = {
        length: password.length >= 8,
        upper: /[A-Z]/.test(password),
        lower: /[a-z]/.test(password),
        number: /\d/.test(password),
        special: /[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?]/.test(password)
      };

      updateCheck("checkLength", checks.length, "8+ characters");
      updateCheck("checkUpper", checks.upper, "Uppercase letter");
      updateCheck("checkLower", checks.lower, "Lowercase letter");
      updateCheck("checkNumber", checks.number, "Number");
      updateCheck("checkSpecial", checks.special, "Special character");

      const allPasswordChecksPass = Object.values(checks).every(Boolean);
      const matchHint = document.getElementById("matchHint");

      if (confirm.length > 0) {
        if (password === confirm) {
          matchHint.textContent = "✓ Passwords match";
          matchHint.style.color = "#16a34a";
        } else {
          matchHint.textContent = "✕ Passwords do not match";
          matchHint.style.color = "#dc2626";
        }
      } else {
        matchHint.textContent = "";
      }

      const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      const usernameValid = username.length >= 3;

      const formValid = allPasswordChecksPass && password === confirm && confirm.length > 0 && emailValid && usernameValid;
      document.getElementById("signupBtn").disabled = !formValid;
    }

    function updateCheck(id, passed, label) {
      const el = document.getElementById(id);
      el.textContent = (passed ? "✓ " : "○ ") + label;
      el.style.color = passed ? "#16a34a" : "#64748b";
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const response = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();

      if (data.token) {
        localStorage.setItem("token", data.token);
        localStorage.setItem("username", data.username);
        window.location.href = "/dashboard.html";
      } else {
        document.getElementById("authMessage").textContent = data.error;
      }
    }

    async function signup() {
      const username = document.getElementById("signupUsername").value;
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPassword").value;
      const confirmPassword = document.getElementById("signupConfirmPassword").value;

      const response = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password, confirmPassword })
      });
      const data = await response.json();

      if (response.ok) {
        document.getElementById("authMessage").style.color = "#16a34a";
        document.getElementById("authMessage").textContent = "Account created! Please check your email to verify your account.";
        setTimeout(() => switchTab("login"), 1500);
      } else {
        document.getElementById("authMessage").style.color = "#dc2626";
        document.getElementById("authMessage").textContent = data.error;
      }
    }

    if (localStorage.getItem("token")) {
      window.location.href = "/dashboard.html";
    }
  </script>
</body>
</html>
